name: Build OpenWrt for WatchGuard Firebox T30-W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v4
        with:
          repository: dmascord/openwrt
          ref: add-watchguard-t30-w

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison \
            gawk gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget cmake

      - name: Update Feeds Safely
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -p packages -a
          ./scripts/feeds install -p luci -a

      - name: Isolate WatchGuard T30-W (Clean Override)
        run: |
          cat << 'EOF' > target/linux/mpc85xx/image/p1010.mk
          define Build/watchguard_firebox-t30-bootfs
          	rm -f $(KDIR)/watchguard_firebox-t30-bootfs.img
          	TOPDIR=$(TOPDIR) sh $(TOPDIR)/scripts/make_watchguard_t30w_bootfs.sh \
          		$(STAGING_DIR_HOST)/bin \
          		$(IMAGE_KERNEL) \
          		$(KDIR)/image-$(firstword $(DEVICE_DTS)).dtb \
          		$(KDIR)/watchguard_firebox-t30-bootfs.img
          endef

          define Build/watchguard_firebox-t30-factory
          	rm -f $@
          	TOPDIR=$(TOPDIR) sh $(TOPDIR)/scripts/make_watchguard_t30w_sdimage.sh \
          		$(STAGING_DIR_HOST)/bin \
          		$(KDIR)/watchguard_firebox-t30-bootfs.img \
          		$(IMAGE_ROOTFS) \
          		$@
          endef

          define Device/watchguard_firebox-t30
            DEVICE_VENDOR := Watchguard
            DEVICE_MODEL := Firebox T30-W
            DEVICE_ALT0_VENDOR := Watchguard
            DEVICE_ALT0_MODEL := Firebox T30
            DEVICE_PACKAGES := ath10k-firmware-qca988x-ct block-mount kmod-fs-ext4 \
              kmod-ath10k-ct kmod-usb-storage kmod-usb2 \
              kmod-rtc-s35390a kmod-tpm-i2c-atmel fdisk resize2fs
            IMAGE_SIZE := 64m
            FILESYSTEMS := squashfs
            KERNEL = kernel-bin | uImage none
            KERNEL_INITRAMFS := kernel-bin | uImage none
            KERNEL_NAME := zImage.la3000000
            KERNEL_ENTRY := 0x3000000
            KERNEL_LOADADDR := 0x3000000
            IMAGES := factory.img.gz sysupgrade.bin
            IMAGE/factory.img.gz := watchguard_firebox-t30-bootfs | watchguard_firebox-t30-factory
            IMAGE/sysupgrade.bin := watchguard_firebox-t30-bootfs | sysupgrade-tar \
          	kernel=$(KDIR)/watchguard_firebox-t30-bootfs.img | append-metadata | check-size
          endef
          TARGET_DEVICES += watchguard_firebox-t30
          EOF

      - name: Add Universal Auto-Resize Script on First Boot
        run: |
          mkdir -p target/linux/mpc85xx/base-files/etc/uci-defaults
          cat << 'EOF' > target/linux/mpc85xx/base-files/etc/uci-defaults/70-rootpt-resize
          #!/bin/sh
          if [ -b /dev/mmcblk0 ]; then
              # Επέκταση του partition 4 στο 100% της κάρτας SD
              (echo p; echo d; echo 4; echo n; echo p; echo 4; echo ; echo ; echo N; echo w) | fdisk /dev/mmcblk0
              # Ενημέρωση του kernel και επέκταση του filesystem
              partx -u /dev/mmcblk0 2>/dev/null || true
              resize2fs /dev/mmcblk0p4
          fi
          exit 0
          EOF
          chmod +x target/linux/mpc85xx/base-files/etc/uci-defaults/70-rootpt-resize

      - name: Verify Patch Integrity
        run: |
          echo "=== ΝΕΟ ΠΕΡΙΕΧΟΜΕΝΟ p1010.mk ==="
          cat target/linux/mpc85xx/image/p1010.mk
          echo "================================="

      - name: Configure OpenWrt Target
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_mpc85xx=y
          CONFIG_TARGET_mpc85xx_p1010=y
          CONFIG_TARGET_ALL_PROFILES=n
          CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          #CONFIG_TARGET_ROOTFS_EXT4FS is not set

          # Εγκατάσταση LuCI (Web Interface)
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y

          # Εργαλεία Διαχείρισης Δίσκων για το Auto-Resize Script
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_e2fsprogs=y
          EOF
          make defconfig

      - name: Build Firmware
        run: |
          make -j$(nproc) download
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchguard-t30w-openwrt-images
          path: bin/targets/mpc85xx/p1010/
