name: Build WatchGuard T30-W

on:  
  workflow_dispatch:

jobs:  
  build:    
    runs-on: ubuntu-22.04    
    steps:      
      - name: Checkout Code      
        uses: actions/checkout@v4        
        with:          
          repository: dmascord/openwrt          
          ref: 'add-watchguard-t30-w'
          fetch-depth: 0

      - name: Install Dependencies        
        run: |          
          sudo apt update          
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig python3-dev python3-setuptools python3 python-is-python3          
          sudo ln -sf /usr/bin/python3 /usr/bin/python      

      - name: Update and Install Feeds        
        run: |          
          ./scripts/feeds update -a          
          ./scripts/feeds install -a      

      - name: Configure and Build        
        run: |          
          echo "CONFIG_TARGET_mpc85xx=y" > .config          
          echo "CONFIG_TARGET_mpc85xx_p1010=y" >> .config          
          echo "CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30=y" >> .config          
          echo "CONFIG_PACKAGE_luci=y" >> .config          
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config          
          echo "CONFIG_PACKAGE_kmod-mv88e6085=y" >> .config          
          echo "CONFIG_PACKAGE_kmod-swconfig=y" >> .config          
          echo "CONFIG_PACKAGE_ttyd=y" >> .config          
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config          
          echo "CONFIG_PACKAGE_kmod-wireguard=y" >> .config          
          echo "CONFIG_PACKAGE_luci-app-wireguard=y" >> .config          
          echo "CONFIG_PACKAGE_luci-app-pbr=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openvpn=y" >> .config
          echo "CONFIG_PACKAGE_openvpn-openssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-adblock-fast=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-adblock=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-banip=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-sqm=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-nlbwmon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-vnstat=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-statistics=y" >> .config          
          echo "CONFIG_PACKAGE_htop=y" >> .config          
          echo "CONFIG_PACKAGE_nano=y" >> .config          
          echo "CONFIG_PACKAGE_bash=y" >> .config          
          echo "CONFIG_PACKAGE_tcpdump=y" >> .config
          echo "CONFIG_PACKAGE_ip-full=y" >> .config
          echo "CONFIG_PACKAGE_kmod-8021q=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config          
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config          
          echo "CONFIG_PACKAGE_parted=y" >> .config          
          echo "CONFIG_PACKAGE_resize2fs=y" >> .config          
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config          
          echo "CONFIG_PACKAGE_lsblk=y" >> .config          
          echo "CONFIG_PACKAGE_blkid=y" >> .config          
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=500" >> .config          
          
          # ΑΥΤΗ Η ΓΡΑΜΜΗ ΣΩΖΕΙ ΤΗΝ ΚΑΤΑΣΤΑΣΗ:
          echo "CONFIG_TARGET_IMAGES_GENTARGET_GPT=n" >> .config
          
          make defconfig          
          make download -j$(nproc)          
          export FORCE_UNSAFE_CONFIGURE=1          
          make -j$(nproc) PROFILE=watchguard_firebox-t30 || make -j1 V=s PROFILE=watchguard_firebox-t30

      - name: Upload Artifacts        
        uses: actions/upload-artifact@v4        
        with:          
          name: WatchGuard-T30-Firmware          
          path: bin/targets/mpc85xx/p1010/
