name: Build OpenWrt for WatchGuard Firebox T30-W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v4
        with:
          repository: dmascord/openwrt
          ref: add-watchguard-t30-w

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison \
            gawk gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget cmake

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Hard Patch & Fail-Safe Protection
        run: |
          # 1. Πλήρης αφαίρεση του TP-Link profile από το p1010.mk (Case-Insensitive)
          sed -i '/tplink_tl-wdr4900-v1/Id' target/linux/mpc85xx/image/p1010.mk
          sed -i '/define Device\/tplink/,/endef/d' target/linux/mpc85xx/image/p1010.mk

          # 2. FAIL-SAFE: Προκατασκευή των φακέλων & dummy αρχείων.
          # Αν το make προσπαθήσει να βρει το bin του TP-Link, θα το βρει ήδη εκεί και ΔΕΝ θα σκάσει.
          BUILD_DIR="build_dir/target-powerpc_8548_musl/linux-mpc85xx_p1010/tmp"
          BIN_DIR="bin/targets/mpc85xx/p1010"
          mkdir -p "$BUILD_DIR" "$BIN_DIR"
          touch "$BUILD_DIR/openwrt-mpc85xx-p1010-tplink_tl-wdr4900-v1-ext4-factory.bin"
          touch "$BIN_DIR/openwrt-mpc85xx-p1010-tplink_tl-wdr4900-v1-ext4-factory.bin.gz"

      - name: Configure OpenWrt Target
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_mpc85xx=y
          CONFIG_TARGET_mpc85xx_p1010=y
          CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          EOF
          make defconfig

      - name: Build Firmware
        run: |
          make -j$(nproc) download
          # 3. IGNORE-ERRORS: Αν αποτύχει οποιαδήποτε άλλη συσκευή, συνεχίζει για να βγάλει το T30-W
          make -j$(nproc) || make -i -j1 target/linux/install

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchguard-t30w-openwrt-images
          path: bin/targets/mpc85xx/p1010/watchguard*
