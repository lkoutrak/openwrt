name: Build OpenWrt for WatchGuard Firebox T30-W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v4
        with:
          repository: dmascord/openwrt
          ref: add-watchguard-t30-w

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison \
            gawk gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget cmake

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Isolate WatchGuard T30-W (Safe Python Patch)
        run: |
          python3 -c '
          path = "target/linux/mpc85xx/image/p1010.mk"
          with open(path, "r") as f:
              lines = f.readlines()
          
          new_lines = []
          skip = False
          for line in lines:
              if "define Device/tplink" in line:
                  skip = True
              if skip and "endef" in line:
                  skip = False
                  continue
              if not skip:
                  new_lines.append(line)
          
          with open(path, "w") as f:
              f.writelines(new_lines)
          '

      - name: Verify Patch Integrity (Inspection Step)
        run: |
          echo "=== ΠΕΡΙΕΧΟΜΕΝΑ TARGET FILE (p1010.mk) ==="
          cat target/linux/mpc85xx/image/p1010.mk
          echo "========================================="
          
          # Έλεγχος αν παρέμεινε το TP-Link
          if grep -q "tplink" target/linux/mpc85xx/image/p1010.mk; then
            echo "ERROR: Το TP-Link profile βρίσκεται ακόμα μέσα στο αρχείο!"
            exit 1
          else
            echo "SUCCESS: Το TP-Link αφαιρέθηκε επιτυχώς."
          fi

      - name: Configure OpenWrt Target
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_mpc85xx=y
          CONFIG_TARGET_mpc85xx_p1010=y
          CONFIG_TARGET_ALL_PROFILES=n
          CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          EOF
          make defconfig

      - name: Build Firmware
        run: |
          make -j$(nproc) download
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchguard-t30w-openwrt-images
          path: bin/targets/mpc85xx/p1010/
