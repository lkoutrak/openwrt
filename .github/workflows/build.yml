name: Build WatchGuard T30-W Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: dmascord/openwrt
          ref: 'add-watchguard-t30-w'
          fetch-depth: 0

      - name: Inject T30 Support
        run: |
          printf '\ndefine Device/watchguard_firebox-t30\n  DEVICE_VENDOR := Watchguard\n  DEVICE_MODEL := Firebox T30\n  DEVICE_ALT0_VENDOR := Watchguard\n  DEVICE_ALT0_MODEL := Firebox T30-W\n  DEVICE_PACKAGES := kmod-rtc-s35390a kmod-eeprom-at24\n  KERNEL = kernel-bin | libdeflate-gzip | fit gzip $(KDIR)/image-$$(DEVICE_DTS).dtb\n  KERNEL_NAME := zImage.la3000000\n  KERNEL_ENTRY := 0x3000000\n  KERNEL_LOADADDR := 0x3000000\n  IMAGES := sysupgrade.bin factory.img.gz\n  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata\n  IMAGE/factory.img.gz := boot-script | gzip\nendef\nTARGET_DEVICES += watchguard_firebox-t30\n' >> target/linux/mpc85xx/image/p1010.mk

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig python3-dev python3-setuptools python3 python-is-python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure and Build
        run: |
          rm -f .config
          echo "CONFIG_TARGET_mpc85xx=y" > .config
          echo "CONFIG_TARGET_mpc85xx_p1010=y" >> .config
          echo "CONFIG_TARGET_ALL_PROFILES=n" >> .config
          echo "CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config

          make defconfig
          make download -j$(nproc)

          export FORCE_UNSAFE_CONFIGURE=1
          make -j$(nproc) PROFILE=watchguard_firebox-t30 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WatchGuard-T30-Firmware
          path: bin/targets/mpc85xx/p1010/
