name: Build WatchGuard T30-W Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: dmascord/openwrt
          ref: 'add-watchguard-t30-w'
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig python3-dev python3-setuptools python3 python-is-python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure and Build
        run: |
          # 1. Καθαρισμός παλαιών ρυθμίσεων
          rm -f .config

          # 2. Στόχευση αποκλειστικά στο WatchGuard T30-W
          echo "CONFIG_TARGET_mpc85xx=y" > .config
          echo "CONFIG_TARGET_mpc85xx_p1010=y" >> .config
          echo "CONFIG_TARGET_ALL_PROFILES=n" >> .config
          echo "CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30=y" >> .config

          # 3. Βασικά πακέτα διεπαφής και drivers
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mv88e6085=y" >> .config
          echo "CONFIG_PACKAGE_kmod-swconfig=y" >> .config

          # 4. Υπολογισμός εξαρτήσεων και λήψη πηγαίου κώδικα
          make defconfig
          make download -j$(nproc)

          # 5. Εκτέλεση μεταγλώττισης (Build)
          export FORCE_UNSAFE_CONFIGURE=1
          make -j$(nproc) PROFILE=watchguard_firebox-t30 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WatchGuard-T30-Firmware
          path: bin/targets/mpc85xx/p1010/
