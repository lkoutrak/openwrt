name: Build WatchGuard T30-W Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository Base
        uses: actions/checkout@v4
        with:
          repository: dmascord/openwrt
          ref: 'add-watchguard-t30-w'

      - name: Patch T30 Definitions into p1010.mk
        run: |
          cat << 'EOF' >> target/linux/mpc85xx/image/p1010.mk

          define Device/watchguard_firebox-t30
            DEVICE_VENDOR := Watchguard
            DEVICE_MODEL := Firebox T30
            DEVICE_ALT0_VENDOR := Watchguard
            DEVICE_ALT0_MODEL := Firebox T30-W
            DEVICE_PACKAGES := kmod-rtc-s35390a kmod-eeprom-at24 kmod-sdhci-of-esdhc
            KERNEL = kernel-bin | libdeflate-gzip | fit gzip $(KDIR)/image-$$(DEVICE_DTS).dtb
            KERNEL_NAME := zImage.la3000000
            KERNEL_ENTRY := 0x3000000
            KERNEL_LOADADDR := 0x3000000
            IMAGES := sysupgrade.bin
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          endef
          TARGET_DEVICES += watchguard_firebox-t30
          EOF

      - name: Create SD Image Generator Script
        run: |
          cat << 'EOF' > scripts/make_watchguard_t30w_sdimage.sh
          #!/usr/bin/env bash
          set -e

          SYSUPGRADE_TAR="$1"
          INITRAMFS_BIN="$2"
          OUTPUT_IMG="$3"

          if [ -z "$SYSUPGRADE_TAR" ] || [ -z "$INITRAMFS_BIN" ] || [ -z "$OUTPUT_IMG" ]; then
              echo "Usage: $0 <sysupgrade.bin/tar> <initramfs.bin> <output.img>"
              exit 1
          fi

          # Create 128MB dummy image
          dd if=/dev/zero of="$OUTPUT_IMG" bs=1M count=128 status=none

          # Partition table: Part 1 = 32MB FAT32 (Boot/Kernel), Part 2 = Rest Ext4 (Rootfs)
          parted -s "$OUTPUT_IMG" mklabel msdos
          parted -s "$OUTPUT_IMG" mkpart primary fat32 1MiB 33MiB
          parted -s "$OUTPUT_IMG" mkpart primary ext4 33MiB 100%

          LOOP_DEV=$(sudo losetup -fP --show "$OUTPUT_IMG")

          sudo mkfs.vfat -n "BOOT" "${LOOP_DEV}p1"
          sudo mkfs.ext4 -F -L "ROOT" "${LOOP_DEV}p2"

          MOUNT_DIR=$(mktemp -d)
          sudo mount "${LOOP_DEV}p1" "$MOUNT_DIR"
          sudo cp "$INITRAMFS_BIN" "$MOUNT_DIR/uImage"
          sudo umount "$MOUNT_DIR"

          sudo losetup -d "$LOOP_DEV"
          rm -rf "$MOUNT_DIR"
          echo "SD Image created successfully: $OUTPUT_IMG"
          EOF
          chmod +x scripts/make_watchguard_t30w_sdimage.sh

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig python3-dev python3-setuptools python3 python-is-python3 parted dosfstools
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for T30
        run: |
          rm -f .config
          echo "CONFIG_TARGET_mpc85xx=y" > .config
          echo "CONFIG_TARGET_mpc85xx_p1010=y" >> .config
          echo "CONFIG_TARGET_ALL_PROFILES=n" >> .config
          echo "CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          make defconfig

      - name: Build Firmware
        run: |
          export FORCE_UNSAFE_CONFIGURE=1
          make -j$(nproc) PROFILE=watchguard_firebox-t30 V=s

      - name: Generate Factory SD Image
        run: |
          cd bin/targets/mpc85xx/p1010/
          SYS=$(ls *-watchguard_firebox-t30-squashfs-sysupgrade.bin 2>/dev/null || true)
          KER=$(ls *-watchguard_firebox-t30-initramfs-kernel.bin 2>/dev/null || true)
          
          if [ -n "$SYS" ] && [ -n "$KER" ]; then
            ../../../../scripts/make_watchguard_t30w_sdimage.sh "$SYS" "$KER" factory.img
            gzip -9 factory.img
            mv factory.img.gz openwrt-mpc85xx-p1010-watchguard_firebox-t30-squashfs-factory.img.gz
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WatchGuard-T30-Firmware
          path: bin/targets/mpc85xx/p1010/
