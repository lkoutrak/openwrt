name: Build OpenWrt for WatchGuard Firebox T30-W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v4
        with:
          repository: dmascord/openwrt
          ref: add-watchguard-t30-w

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison \
            gawk gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget cmake

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch target to remove broken TP-Link profile
        run: |
          # Αφαίρεση του block ορισμού της συσκευής tplink_tl-wdr4900-v1 από το p1010.mk
          sed -i '/define Device\/tplink_tl-wdr4900-v1/,/endef/d' target/linux/mpc85xx/image/p1010.mk
          # Αφαίρεση τυχόν αναφοράς της συσκευής από τη λίστα TARGET_DEVICES
          sed -i '/tplink_tl-wdr4900-v1/d' target/linux/mpc85xx/image/p1010.mk

      - name: Configure OpenWrt Target
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_mpc85xx=y
          CONFIG_TARGET_mpc85xx_p1010=y
          CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          EOF
          make defconfig

      - name: Build Firmware
        run: |
          make -j$(nproc) download
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchguard-t30w-openwrt-images
          path: bin/targets/mpc85xx/p1010/
