name: Build OpenWrt for WatchGuard Firebox T30-W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v4
        with:
          repository: lkoutrak/openwrt
          ref: add-watchguard-t30-w

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison \
            gawk gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget cmake

      - name: Update Feeds Safely
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -p packages -a
          ./scripts/feeds install -p luci -a

      - name: Verify Patch Integrity
        run: |
          echo "=== ΠΕΡΙΕΧΟΜΕΝΟ p1010.mk ==="
          cat target/linux/mpc85xx/image/p1010.mk

      - name: Configure OpenWrt Target
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_mpc85xx=y
          CONFIG_TARGET_mpc85xx_p1010=y
          CONFIG_TARGET_ALL_PROFILES=n
          CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30=y
          CONFIG_TARGET_DEVICE_mpc85xx_p1010_DEVICE_watchguard_firebox-t30-w=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          # Προεγκατάσταση Web Interface (LuCI)
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-app-firewall=y

          # Εργαλεία Διαχείρισης Δίσκων
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_e2fsprogs=y
          EOF
          make defconfig

      - name: Build Firmware
        run: |
          make -j$(nproc) download
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchguard-t30w-openwrt-images
          path: bin/targets/mpc85xx/p1010/
